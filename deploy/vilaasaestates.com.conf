# Apache vhost for www.vilaasaestates.com — Hostinger VPS
#
# Install:
#   sudo cp deploy/vilaasaestates.com.conf /etc/apache2/sites-available/
#   sudo a2enmod proxy proxy_http headers rewrite ssl
#   sudo a2ensite vilaasaestates.com
#   sudo apache2ctl configtest && sudo systemctl reload apache2
#
# Then obtain the certificate. Certbot reads this vhost and generates the
# matching :443 vhost, carrying these proxy directives across:
#   sudo certbot --apache -d vilaasaestates.com -d www.vilaasaestates.com
#
# Apache serves nothing from disk here; every request is proxied to the nginx
# container published on loopback by docker compose.

<VirtualHost *:80>
    ServerName vilaasaestates.com
    ServerAlias www.vilaasaestates.com

    ErrorLog  ${APACHE_LOG_DIR}/vilaasa-error.log
    CustomLog ${APACHE_LOG_DIR}/vilaasa-access.log combined

    # Send the browser's Host through untouched so the app builds correct URLs.
    ProxyPreserveHost On

    # Tells Express (trust proxy = 1) that the original request was HTTPS, so
    # secure-cookie and redirect logic behaves. Certbot's :443 vhost inherits it.
    RequestHeader set X-Forwarded-Proto "http"

    # Large brochure and video uploads pass through here; the default 60s
    # would abort them mid-transfer.
    ProxyTimeout 300

    ProxyPass        / http://127.0.0.1:8080/
    ProxyPassReverse / http://127.0.0.1:8080/

    # Let certbot answer the ACME challenge from disk rather than proxying it.
    ProxyPass /.well-known/acme-challenge/ !
    Alias /.well-known/acme-challenge/ /var/www/html/.well-known/acme-challenge/
    <Directory "/var/www/html/.well-known/acme-challenge/">
        Require all granted
    </Directory>
</VirtualHost>

# ---------------------------------------------------------------------------
# After certbot runs, edit the generated :443 vhost it creates and confirm the
# two lines below are present, then add the apex-to-www redirect.
#
# <VirtualHost *:443>
#     ServerName www.vilaasaestates.com
#     RequestHeader set X-Forwarded-Proto "https"     <-- must say https
#     ProxyPreserveHost On
#     ProxyTimeout 300
#     ProxyPass        / http://127.0.0.1:8080/
#     ProxyPassReverse / http://127.0.0.1:8080/
#     SSLCertificateFile    /etc/letsencrypt/live/vilaasaestates.com/fullchain.pem
#     SSLCertificateKeyFile /etc/letsencrypt/live/vilaasaestates.com/privkey.pem
# </VirtualHost>
#
# <VirtualHost *:443>
#     ServerName vilaasaestates.com
#     Redirect permanent / https://www.vilaasaestates.com/
#     SSLCertificateFile    /etc/letsencrypt/live/vilaasaestates.com/fullchain.pem
#     SSLCertificateKeyFile /etc/letsencrypt/live/vilaasaestates.com/privkey.pem
# </VirtualHost>
