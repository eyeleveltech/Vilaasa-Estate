# Vilaasa Estates — production stack for the Hostinger VPS.
#
# Only the web container is published, and only on loopback: Apache on the host
# terminates TLS for www.vilaasaestates.com and reverse-proxies to 127.0.0.1:8080.
# Postgres and the API are reachable solely on the internal compose network.

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    # Credentials come from the same file the API reads, so the two can never
    # drift apart. This uses env_file rather than ${VAR} substitution on
    # purpose: compose substitutes only from the shell or from a file named
    # exactly `.env`, never from an arbitrarily named one, so ${POSTGRES_USER}
    # here would silently expand to an empty string and postgres would refuse
    # to start. env_file instead injects the values into the container, where
    # the escaped $$ in the healthcheck below resolves them.
    env_file:
      - .env.production
    environment:
      # Keeps the volume's collation stable across future image upgrades.
      POSTGRES_INITDB_ARGS: "--encoding=UTF8"
    volumes:
      - vilaasa-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  backend:
    build:
      context: ./backend
    restart: unless-stopped
    # PID 1 that reaps zombies and forwards SIGTERM, so restarts are not
    # held up by the 10s kill timeout.
    init: true
    env_file:
      - .env.production
    depends_on:
      postgres:
        condition: service_healthy
    expose:
      - "5000"

  web:
    build:
      context: ./frontend
      args:
        # Same-origin API path; nginx forwards /api/ to the backend service.
        VITE_API_URL: /api/v1
    restart: unless-stopped
    depends_on:
      - backend
    ports:
      - "127.0.0.1:8080:8080"

volumes:
  vilaasa-db:
