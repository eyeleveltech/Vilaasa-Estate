# Apache terminates TLS on the host and sets X-Forwarded-For to the real client
# IP. We pass that header through UNCHANGED rather than appending to it: the
# Express app sets `trust proxy = 1`, so it expects exactly one address in the
# chain. Appending here would make req.ip resolve to Apache's loopback address
# and collapse the per-IP rate limiter into a single global bucket.
map $http_x_forwarded_proto $forwarded_proto {
    default $http_x_forwarded_proto;
    ""      $scheme;
}

# $remote_addr is always the host's docker gateway, so it says nothing about
# who is calling. fwd= is the real client as reported by Apache; if it logs as
# "-" then Apache is not sending X-Forwarded-For and every visitor collapses
# into a single rate-limit bucket.
log_format proxied '$remote_addr fwd="$http_x_forwarded_for" '
                   '"$request" $status $body_bytes_sent '
                   '"$http_user_agent"';

server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Multer accepts uploads up to 100 MB; nginx must not truncate them first.
    client_max_body_size 100m;

    access_log /var/log/nginx/access.log proxied;
    error_log  /var/log/nginx/error.log warn;

    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_proxied any;
    gzip_types text/plain text/css application/javascript application/json
               application/xml image/svg+xml font/woff2;

    # ----- API -----------------------------------------------------------
    location /api/ {
        proxy_pass http://backend:5000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $http_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $forwarded_proto;

        # Brochure and video uploads are slow; do not cut them off.
        proxy_connect_timeout 30s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # Stream large uploads straight through instead of spooling to disk.
        proxy_request_buffering off;
    }

    # ----- Static assets --------------------------------------------------
    # Vite emits content-hashed filenames, so these can be cached indefinitely.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    location /videos/ {
        expires 30d;
        add_header Cache-Control "public";
        try_files $uri =404;
    }

    # The shell must never be cached, or clients pin to a stale bundle.
    location = /index.html {
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # ----- SPA fallback ---------------------------------------------------
    # /admin, /vault, /partner and friends are client-side routes with no file
    # on disk; React Router resolves them once index.html loads.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
