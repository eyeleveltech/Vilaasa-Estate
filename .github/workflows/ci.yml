name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# A newer push to the same ref supersedes an in-flight run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  backend:
    name: Backend - typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: backend/package-lock.json

      - name: Install dependencies
        working-directory: backend
        run: npm ci --no-audit --no-fund

      - name: Generate Prisma client
        working-directory: backend
        run: npx prisma generate

      - name: Typecheck
        working-directory: backend
        run: npx tsc --noEmit

  frontend:
    name: Frontend - build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: frontend
        run: npm ci --no-audit --no-fund

      # Non-blocking: the tree has 25 pre-existing lint errors (mostly
      # no-explicit-any). Surfaced here for visibility; flip to blocking once
      # they are cleared.
      - name: Lint (non-blocking)
        working-directory: frontend
        continue-on-error: true
        run: npm run lint

      - name: Build
        working-directory: frontend
        env:
          VITE_API_URL: /api/v1
        run: npm run build

  stack:
    name: Docker stack - build & smoke test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Throwaway values. No real credential is ever needed in CI: the smoke
      # test never uploads to Cloudinary or sends mail, and the env validator
      # only checks that the variables are present and well-formed.
      - name: Write CI environment file
        run: |
          cat > .env.production <<'EOF'
          PORT=5000
          NODE_ENV=production
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=ci-throwaway-password
          POSTGRES_DB=vilaasa
          DATABASE_URL=postgresql://postgres:ci-throwaway-password@postgres:5432/vilaasa
          JWT_SECRET=ci-throwaway-secret-min-32-chars-0123456789abcdef
          JWT_EXPIRES_IN=7d
          CLOUDINARY_CLOUD_NAME=ci-placeholder
          CLOUDINARY_API_KEY=000000000000000
          CLOUDINARY_API_SECRET=ci-placeholder-secret
          ALLOWED_ORIGINS=http://localhost:8080
          FRONTEND_URL=http://localhost:8080
          APP_URL=http://localhost:8080
          EOF

      # Builds both images exactly as the VPS will, then runs them together.
      - name: Build and start the stack
        run: docker compose up -d --build

      - name: Wait for the API to report healthy
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health >/dev/null 2>&1; then
              echo "API healthy after about $((i * 2))s"
              exit 0
            fi
            sleep 2
          done
          echo "API never became healthy"
          exit 1

      - name: API health endpoint responds
        run: |
          curl -fsS http://127.0.0.1:8080/api/v1/health | tee /dev/stderr \
            | grep -q '"status":"healthy"'

      # Proves the entrypoint's `prisma migrate deploy` ran against a real
      # database rather than silently no-opping.
      - name: Migrations were applied
        run: |
          docker compose exec -T postgres \
            psql -U postgres -d vilaasa -c '\dt' | tee /dev/stderr | grep -q 'User'

      - name: SPA is served
        run: curl -fsS http://127.0.0.1:8080/ | grep -q 'id="root"'

      - name: Client-side routes fall back to index.html
        run: |
          for route in /admin/login /vault/login /partner/login; do
            code=$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$route")
            echo "$route -> $code"
            if [ "$code" != "200" ]; then
              echo "SPA fallback broken for $route"
              exit 1
            fi
          done

      # Regression test for the privilege escalation fixed in 61ca73e. If this
      # ever returns 201, anyone on the internet can mint themselves an admin.
      - name: Security - anonymous SUPER_ADMIN creation is refused
        run: |
          code=$(curl -s -o /tmp/resp.json -w '%{http_code}' \
            -X POST http://127.0.0.1:8080/api/v1/auth/register \
            -H 'Content-Type: application/json' \
            -d '{"email":"attacker@ci.test","password":"Password123!","name":"A","role":"SUPER_ADMIN"}')
          echo "HTTP $code - $(cat /tmp/resp.json)"
          if [ "$code" != "401" ]; then
            echo "REGRESSION: expected 401, got $code"
            exit 1
          fi

      - name: Public endpoints are still reachable
        run: |
          for path in /api/v1/auth/login /api/v1/channel-partners/register; do
            code=$(curl -s -o /dev/null -w '%{http_code}' \
              -X POST "http://127.0.0.1:8080$path" \
              -H 'Content-Type: application/json' -d '{}')
            echo "$path -> $code"
            if [ "$code" = "401" ]; then
              echo "$path should be public but is gated"
              exit 1
            fi
          done

      - name: Container logs (on failure)
        if: failure()
        run: docker compose logs --tail=200

      - name: Tear down
        if: always()
        run: docker compose down -v
