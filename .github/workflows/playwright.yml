name: Playwright Tests

# Manual only. These specs navigate to hardcoded http://localhost:8080 URLs and
# assert on real estate and franchise content, so they need a stack that is both
# running AND seeded. Neither is true on a fresh CI database, which is why this
# is not wired to push/pull_request - a permanently red check trains people to
# ignore CI. The deterministic checks that do gate merges live in ci.yml.
#
# To gate merges on these too: seed the stack in the step below, confirm the
# suite is green, then add the push/pull_request triggers back.
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    timeout-minutes: 60
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Write CI environment file
        run: |
          cat > .env.production <<'EOF'
          PORT=5000
          NODE_ENV=production
          POSTGRES_USER=postgres
          POSTGRES_PASSWORD=ci-throwaway-password
          POSTGRES_DB=vilaasa
          DATABASE_URL=postgresql://postgres:ci-throwaway-password@postgres:5432/vilaasa
          JWT_SECRET=ci-throwaway-secret-min-32-chars-0123456789abcdef
          JWT_EXPIRES_IN=7d
          CLOUDINARY_CLOUD_NAME=ci-placeholder
          CLOUDINARY_API_KEY=000000000000000
          CLOUDINARY_API_SECRET=ci-placeholder-secret
          ALLOWED_ORIGINS=http://localhost:8080
          FRONTEND_URL=http://localhost:8080
          APP_URL=http://localhost:8080
          EOF

      # The suite targets localhost:8080, which is exactly where compose
      # publishes the nginx container.
      - name: Start the stack
        run: docker compose up -d --build

      - name: Wait for the stack
        run: |
          for i in $(seq 1 60); do
            if curl -fsS http://127.0.0.1:8080/api/v1/health >/dev/null 2>&1; then
              echo "stack up"
              exit 0
            fi
            sleep 2
          done
          echo "stack never came up"
          exit 1

      - name: Install dependencies
        run: npm ci --no-audit --no-fund

      - name: Install Playwright browsers
        run: npx playwright install --with-deps

      - name: Run Playwright tests
        run: npx playwright test

      - name: Container logs (on failure)
        if: failure()
        run: docker compose logs --tail=200

      - uses: actions/upload-artifact@v4
        if: ${{ !cancelled() }}
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 30

      - name: Tear down
        if: always()
        run: docker compose down -v
